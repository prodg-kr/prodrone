# v9.4.0 부분 수정 변경 요약 (2026-11-21, 감사 보고서 action-code-audit-2026-11-21.md 기반)
# - [신규] concurrency guard 추가 (§3-5): 스케줄 실행과 수동 실행이 겹쳐 같은
#   posted JSON·Hugo 레포를 두고 충돌하는 것을 방지. cancel-in-progress: false라
#   실행 중 런은 끝까지 가고, 다음 런은 대기한다.
# - [수정] python -u 실행 (§4-9): 출력 버퍼링 때문에 Actions 로그 타임스탬프가
#   뭉개지는 문제 방지.
# - [유지] 스케줄 10:00 KST (cron '0 1 * * *'), workflow_dispatch 입력
#   (force_update/gemini_model/target_url), posted_articles 커밋 스텝,
#   최소 권한 contents: write.
name: drone.jp → proDRONE.kr 자동 번역 및 게시

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 KST 10:00 (UTC 01:00)
  workflow_dispatch:
    inputs:
      force_update:
        description: '이미 게시된 기사도 재처리 (true/false)'
        required: false
        default: 'false'
      gemini_model:
        description: 'Gemini 모델 (기본: gemini-2.5-flash-lite)'
        required: false
        default: 'gemini-2.5-flash-lite'
      target_url:
        description: '단일 기사 URL(선택): 예) https://drone.jp/news/....html'
        required: false
        default: ''
      event_name_override:
        description: '스케줄 경로 테스트용: schedule 입력 시 스케줄 경로(RSS + 최신 보충)로 실행 (기본: 실제 이벤트)'
        required: false
        default: ''
      hugo_target_branch:
        description: 'Hugo 사이트 브랜치 (게시물을 푸시할 브랜치; 기본: main)'
        required: false
        default: 'main'
      deploy_verify_base_url:
        description: '배포 검증 기준 URL (기본: https://prodrone.kr)'
        required: false
        default: 'https://prodrone.kr'

# 동시 실행 방지 (§3-5): 같은 그룹의 런은 직렬로만 실행
concurrency:
  group: prodrone-translate
  cancel-in-progress: false

jobs:
  translate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements_prodrone.txt

      - name: 번역 및 게시 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUGO_SITE_REPO: prodgkr/prodrone
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-2.5-flash-lite' }}
          TARGET_URL: ${{ github.event.inputs.target_url || '' }}
          # #10(a): 스케줄 경로를 브랜치에서 미리 시험할 때 사용.
          # GITHUB_EVENT_NAME은 기본 변수라 덮어쓰기가 무시되므로, 그대로 두고
          # 별도 변수로 전달한다. (재검수 1번)
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_MODE_OVERRIDE: ${{ github.event.inputs.event_name_override || '' }}
          # Step 3 (option B): isolated preview-branch test. Schedule runs
          # leave the inputs empty, so these resolve to the defaults.
          HUGO_TARGET_BRANCH: ${{ github.event.inputs.hugo_target_branch || 'main' }}
          DEPLOY_VERIFY_BASE_URL: ${{ github.event.inputs.deploy_verify_base_url || 'https://prodrone.kr' }}
        run: python -u translate_and_post_prodrone.py

      - name: posted_articles 커밋
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git stash
          # main이 아닌 브랜치(v8-test 등)에서도 돌아야 한다. main으로 rebase하면
          # main이 브랜치 생성 이후 전진했을 때 브랜치 커밋을 main 위에 얹으려다
          # 충돌하거나 push가 거부된다. 현재 브랜치 기준으로 rebase한다.
          # main에서 돌 때는 origin main과 동일하다.
          git pull --rebase origin ${{ github.ref_name }}
          git stash pop || true
          git add posted_articles_drone.json
          # 이 커밋은 posted JSON만 바꾸고 사이트 내용은 바꾸지 않으므로
          # Pages 빌드가 필요 없다 — [CF-Pages-Skip]으로 빌드를 건너뛴다.
          git diff --cached --quiet || git commit -m "[CF-Pages-Skip] chore: update posted_articles"
          git push

      - name: 완료 로그
        if: always()
        run: |
          echo "✅ 완료: $(date -u) (UTC)"
          echo "모드: ${{ github.event_name }}"
          echo "FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}"
          echo "TARGET_URL=${{ github.event.inputs.target_url || '' }}"
