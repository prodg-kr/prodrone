name: drone.jp → proDRONE.kr 자동 번역 및 게시

on:
  schedule:
    # 매일 KST 07:00 = UTC 22:00
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      post_status:
        description: '게시 상태'
        required: false
        default: 'draft'
        type: choice
        options: [draft, publish]
      force_update:
        description: '이미 게시된 기사도 재처리 (true/false)'
        required: false
        default: 'false'
      gemini_model:
        description: 'Gemini 모델 (기본: gemini-2.5-flash-lite)'
        required: false
        default: 'gemini-2.5-flash-lite'
      target_url:
        description: '단일 기사 URL(선택): 예) https://drone.jp/news/....html'
        required: false
        default: ''

jobs:
  translate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements_prodrone.txt

      - name: 번역 및 게시 실행
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_STATUS: ${{ github.event.inputs.post_status || 'draft' }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-2.5-flash-lite' }}
          TARGET_URL: ${{ github.event.inputs.target_url || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python translate_and_post_prodrone.py

      - name: 완료 로그
        if: always()
        run: |
          echo "✅ 완료: $(date -u) (UTC)"
          echo "모드: ${{ github.event_name }}"
          echo "POST_STATUS=${{ github.event.inputs.post_status || 'draft' }}"
          echo "FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}"
          echo "TARGET_URL=${{ github.event.inputs.target_url || '' }}"
